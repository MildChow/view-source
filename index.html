<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Door at Midnight</title>

  <style>
    body {
      background: #111;
      color: #eee;
      font-family: Georgia, serif;
      max-width: 700px;
      margin: 80px auto;
      padding: 20px;
      line-height: 1.8;
    }

    h1 {
      color: #b9a7ff;
      text-align: center;
    }

    .story {
      font-size: 1.2rem;
    }

    a {
      color: #7dd3fc;
      text-decoration: underline;
      cursor: pointer;
    }

    a:hover {
      color: #f0abfc;
    }

    .ending {
      color: #fca5a5;
      font-style: italic;
    }

    button {
      background: #333;
      color: white;
      border: 1px solid #777;
      padding: 8px 15px;
      cursor: pointer;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <h1>The Door at Midnight</h1>

  <div id="story" class="story">
    <p>
      At exactly midnight, you hear three knocks on your bedroom door.
      You live alone.
    </p>

    <p>
      You can either
      <a onclick="showStory('open')">open the door</a>
      or
      <a onclick="showStory('window')">look out the window</a>.
    </p>
  </div>

  <script>
    function showStory(choice) {

      const story = document.getElementById("story");

      if (choice === "open") {

        story.innerHTML = `
          <p>
            You slowly open the door.
          </p>

          <p>
            Nobody is standing there. Instead, you find a small
            black envelope lying on the floor.
          </p>

          <p>
            You can
            <a onclick="showStory('letter')">open the envelope</a>
            or
            <a onclick="showStory('ignore')">leave it alone</a>.
          </p>
        `;

      } else if (choice === "window") {

        story.innerHTML = `
          <p>
            You pull the curtain aside.
          </p>

          <p>
            Across the street, a person is standing beneath a
            flickering streetlight.
          </p>

          <p>
            They are looking directly at your window.
          </p>

          <p>
            You can
            <a onclick="showStory('wave')">wave at them</a>
            or
            <a onclick="showStory('hide')">turn off the lights and hide</a>.
          </p>
        `;

      } else if (choice === "letter") {

        story.innerHTML = `
          <p>
            Inside the envelope is a photograph of your bedroom.
          </p>

          <p>
            The photograph was taken from inside your room.
          </p>

          <p class="ending">
            On the back, someone has written:
            "I'm still here."
          </p>

          <button onclick="location.reload()">Start Again</button>
        `;

      } else if (choice === "ignore") {

        story.innerHTML = `
          <p>
            You decide to leave the envelope where it is.
          </p>

          <p>
            Three more knocks echo through the apartment.
          </p>

          <p class="ending">
            This time, they come from inside your bedroom.
          </p>

          <button onclick="location.reload()">Start Again</button>
        `;

      } else if (choice === "wave") {

        story.innerHTML = `
          <p>
            You raise your hand and wave.
          </p>

          <p>
            The stranger waves back.
          </p>

          <p>
            Then your phone vibrates.
          </p>

          <p class="ending">
            A message appears from an unknown number:
            "Don't wave back."
          </p>

          <button onclick="location.reload()">Start Again</button>
        `;

      } else if (choice === "hide") {

        story.innerHTML = `
          <p>
            You turn off every light and crouch beneath the window.
          </p>

          <p>
            A few seconds pass.
          </p>

          <p>
            Then you hear three knocks.
          </p>

          <p class="ending">
            Not from the front door.
            From the window behind you.
          </p>

          <button onclick="location.reload()">Start Again</button>
        `;
      }
    }
  </script>

</body>
</html>
